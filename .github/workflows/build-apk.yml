name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: test -d android || npx cap add android

      - name: Generate app icon and splash (non-fatal)
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Set version from run number
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"0.4.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk smart-math-board.apk

      - uses: actions/upload-artifact@v4
        with:
          name: smart-math-board-apk
          path: smart-math-board.apk
          if-no-files-found: error
