<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b1020;color:#e5e7eb;font:15px system-ui,sans-serif;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}.hide{display:none!important}
#splash,#home,#work,#load{position:fixed;top:0;left:0;right:0;bottom:0}
#splash{z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#1e2a5a,#0b1020 70%);transition:opacity .5s}
#splash.out{opacity:0}#splash svg{width:130px;height:130px;fill:none;stroke-linecap:round;stroke-width:4}
.d{stroke-dasharray:330;stroke-dashoffset:330;animation:dr 1.6s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#splash h1{margin:14px 0 4px;font-size:26px;animation:up .8s .3s both}#splash p{margin:0;opacity:.6;animation:up .8s .6s both}
.bar{width:160px;height:4px;border-radius:4px;background:#ffffff22;margin-top:22px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#818cf8;animation:fl 2.4s forwards}@keyframes fl{to{width:100%}}
#home{padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 16px;overflow:auto}
#home h2{margin:6px 4px 14px;font-size:22px}#grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:0;border-radius:18px;padding:20px 10px;color:#fff;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 6px 18px #0006}
.card b{font-size:38px;line-height:1}.card:active{transform:scale(.95)}.card.w{grid-column:span 2;flex-direction:row;justify-content:center;gap:14px}
#work{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
